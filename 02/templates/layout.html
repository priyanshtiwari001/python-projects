
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>
        {% if title %}
            FastAPI - {{ title }}
        {% else %}
            FastAPI - Blog
        {% endif %}
    </title>
</head>

<body class="min-h-screen bg-gray-950 text-gray-100">

    <div class="min-h-screen flex">

        <!-- Main -->
        <main class="flex-1">
            {% block content %}
            {% endblock content %}
        </main>

        <!-- Right Sidebar -->
        <aside class="w-48 border-l border-gray-800 p-6 bg-gray-900 fixed min-h-screen">

            <h1 class="text-xl font-bold mb-8 text-white">
                My Blog
            </h1>

            <nav class="space-y-4 text-gray-400">

                <a href="#" class="block hover:text-white hover:font-medium">
                    Home
                </a>

                <a href="#" class="block hover:text-white hover:font-medium">
                    Profile
                </a>

                 <a href="#" class="block hover:text-white hover:font-medium">
                    Register
                </a>

                 <a href="#" class="block hover:text-white hover:font-medium">
                    Login
                </a>

            </nav>

        </aside>

    </div>

</body>
</html>
