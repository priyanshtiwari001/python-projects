
{% extends "layout.html" %}

{% block content %}

<div class="min-h-screen flex justify-center p-8">

    <article class="w-full max-w-4xl">

        <!-- Post Card -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-xl">

            <!-- Author -->
            <div class="flex items-center justify-between mb-8">

                <div class="flex items-center gap-4">

                    <!-- Author Image -->
                    <img
                        src="{{url_for('static',path='profile.png')}}"
                        alt=""
                        class="w-12 h-12 rounded-full object-cover border border-gray-700"
                    >
                </div>

                <!-- Post Actions -->
                <div class="flex gap-3">

                    <!-- Edit -->
                    <a
                        href=""
                        class="px-4 py-2 rounded-lg
                               bg-gray-800 hover:bg-gray-700
                               text-gray-200 text-sm font-medium
                               transition"
                    >
                        Edit Post
                    </a>

                    <!-- Delete -->
                    <button
                        type="button"
                        onclick="openDeleteModal()"
                        class="px-4 py-2 rounded-lg
                               bg-red-600 hover:bg-red-700
                               text-white text-sm font-medium
                               transition"
                    >
                        Delete Post
                    </button>

                </div>

            </div>


            <!-- Title -->
                         <h1 class="text-4xl font-bold text-white mb-6">
                {{post.title}}
            </h1>

                       <div class="text-gray-300 text-lg leading-8 whitespace-pre-line">
               {{post.content}}
            </div>                
        </div>

    </article>

</div>


<!-- ========================= -->
<!-- Delete Confirmation Modal -->
<!-- ========================= -->

<div
    id="deleteModal"
    class="hidden fixed inset-0 z-50
           bg-black/70
           flex items-center justify-center
           p-4"
>

    <div
        class="w-full max-w-md
               bg-gray-900
               border border-gray-800
               rounded-2xl
               p-6
               shadow-2xl"
    >

        <!-- Modal Header -->
        <div class="mb-5">

            <h2 class="text-xl font-bold text-white">
                Delete Post?
            </h2>

            <p class="text-gray-400 mt-2">
                Are you sure you want to delete this post?
                This action cannot be undone.
            </p>

        </div>


        <!-- Modal Buttons -->
        <div class="flex justify-end gap-3">

            <!-- Cancel -->
            <button
                type="button"
                onclick="closeDeleteModal()"
                class="px-5 py-2 rounded-lg
                       bg-gray-700 hover:bg-gray-600
                       text-white font-medium
                       transition"
            >
                Cancel
            </button>


            <!-- Confirm Delete -->
            <form
                action=""
                method="POST"
            >

                <button
                    type="submit"
                    class="px-5 py-2 rounded-lg
                           bg-red-600 hover:bg-red-700
                           text-white font-medium
                           transition"
                >
                    Yes, Delete
                </button>

            </form>

        </div>

    </div>

</div>


<script>

function openDeleteModal() {
    document.getElementById("deleteModal").classList.remove("hidden");
}

function closeDeleteModal() {
    document.getElementById("deleteModal").classList.add("hidden");
}


// Close modal when clicking outside it
document.getElementById("deleteModal").addEventListener("click", function(event) {

    if (event.target === this) {
        closeDeleteModal();
    }

});


// Close modal with Escape key
document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        closeDeleteModal();
    }

});

</script>

{% endblock content %}
